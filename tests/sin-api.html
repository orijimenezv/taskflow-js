<!doctype html>
<html lang="es"><meta charset="utf-8"><title>Prueba de API no disponible</title>
<p>Entorno de prueba: solo se simula el fallo de fetch de la aplicación. Se utiliza el almacenamiento del mismo origen local.</p>
<iframe title="TaskFlow con API no disponible" style="width:100%;height:850px;border:0"></iframe>
<script>
fetch('../index.html').then(r => r.text()).then(html => {
  const base = new URL('../', location.href).href;
  const simulacion = '<base href="' + base + '"><script>window.fetch = async () => { throw new TypeError("API sin conexión (simulación de prueba)"); };<\/script>';
  document.querySelector('iframe').srcdoc = html.replace('<head>', '<head>' + simulacion);
});
</script>
</html>
